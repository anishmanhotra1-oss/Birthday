<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Abhishek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#150E2B;
    --bg2:#241454;
    --gold:#FFC857;
    --coral:#FF5D73;
    --teal:#46E0C6;
    --lav:#C9A7EB;
    --text:#F5F1FF;
    --muted:#B9AEDD;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0;
    min-height:100%;
    background:
      radial-gradient(120% 90% at 50% -10%, #3a1f6e 0%, var(--bg) 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    overflow-x:hidden;
    position:relative;
  }
  .stage{
    position:relative;
    max-width:480px;
    margin:0 auto;
    padding:48px 24px 64px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    min-height:100%;
  }

  /* --- confetti --- */
  .confetti{
    position:fixed;
    top:-10px;
    width:8px;height:14px;
    opacity:0;
    border-radius:2px;
    animation:fall linear forwards;
    z-index:1;
  }
  @keyframes fall{
    0%{ transform:translateY(0) rotate(0deg); opacity:1; }
    100%{ transform:translateY(110vh) rotate(540deg); opacity:0.9; }
  }

  /* --- balloons --- */
  .balloons{
    position:relative;
    width:100%;
    height:130px;
    margin-bottom:8px;
  }
  .balloon{
    position:absolute;
    bottom:0;
    width:46px;height:58px;
    border-radius:50% 50% 50% 50% / 55% 55% 45% 45%;
    animation:rise 4.5s ease-in-out infinite;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.35));
    cursor:pointer;
    pointer-events:auto;
  }
  .balloon.launched{
    animation:flyaway 1.6s cubic-bezier(.25,.6,.35,1) forwards;
  }
  @keyframes flyaway{
    to{ transform:translateY(-160vh) rotate(10deg); opacity:0; }
  }
  .balloon::after{
    content:'';
    position:absolute;
    left:50%;
    top:100%;
    width:1px;height:46px;
    background:rgba(245,241,255,.35);
    transform:translateX(-50%);
  }
  .b1{ left:18%; background:linear-gradient(160deg,var(--coral),#c73a54); animation-delay:0s;}
  .b2{ left:42%; background:linear-gradient(160deg,var(--gold),#e0a326); width:52px;height:64px; animation-delay:.6s;}
  .b3{ left:66%; background:linear-gradient(160deg,var(--teal),#209e8a); animation-delay:1.1s;}
  .b4{ left:83%; background:linear-gradient(160deg,var(--lav),#8a63c9); width:38px;height:48px; animation-delay:1.6s;}
  @keyframes rise{
    0%,100%{ transform:translateY(0) rotate(-3deg);}
    50%{ transform:translateY(-14px) rotate(3deg);}
  }

  .eyebrow{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.01em;
    margin:0 0 6px;
  }
  .wish{
    font-size:16.5px;
    line-height:1.55;
    color:var(--muted);
    max-width:30ch;
    margin:0 0 8px;
  }
  .wish strong{ color:var(--gold); font-weight:600;}
  h1{
    font-family:'Bricolage Grotesque',serif;
    font-weight:800;
    font-size:clamp(2.4rem,10vw,3.4rem);
    line-height:1.02;
    margin:0 0 4px;
    background:linear-gradient(100deg,var(--gold) 0%,var(--coral) 45%,var(--lav) 90%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .name{
    font-family:'Bricolage Grotesque',serif;
    font-weight:800;
    font-size:clamp(2.1rem,9vw,3rem);
    color:var(--text);
    margin:0 0 20px;
  }
  /* --- cake + candle --- */
  .cake-wrap{
    margin:30px 0 34px;
    display:flex;
    flex-direction:column;
    align-items:center;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
  }
  .cake-wrap svg{ width:150px; height:auto; overflow:visible; }
  .flame{
    transform-origin:50% 100%;
    animation:flicker 1.4s ease-in-out infinite;
    transition:opacity .4s ease, transform .4s ease;
  }
  @keyframes flicker{
    0%,100%{ transform:scaleY(1) rotate(-2deg); }
    50%{ transform:scaleY(1.12) rotate(2deg); }
  }
  .flame.out{ opacity:0; transform:scaleY(0); }
  .smoke{
    opacity:0;
    transform-origin:50% 100%;
  }
  .smoke.show{
    animation:smokeUp 1.6s ease-out forwards;
  }
  @keyframes smokeUp{
    0%{ opacity:.6; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-22px) scale(1.8); }
  }
  .cake-hint{
    font-size:12.5px;
    color:var(--muted);
    margin-top:10px;
    letter-spacing:.01em;
  }

  .qr-card{
    width:100%;
    background:var(--text);
    border-radius:24px;
    padding:24px;
  }
  .qr-card img{
    width:100%;
    max-width:280px;
    display:block;
    margin:0 auto;
    border-radius:12px;
  }
  .qr-caption{
    font-size:13px;
    color:#5b5470;
    margin-top:14px;
    font-weight:500;
  }

  .party-btn{
    appearance:none;
    border:none;
    cursor:pointer;
    font-family:'Bricolage Grotesque',serif;
    font-weight:700;
    font-size:17px;
    color:var(--bg);
    background:linear-gradient(100deg,var(--gold),var(--coral));
    padding:16px 30px;
    border-radius:99px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    box-shadow:0 10px 30px -8px rgba(255,93,115,.55);
    transition:transform .25s ease, box-shadow .25s ease;
    margin-top:6px;
  }
  .party-btn:hover{
    transform:translateY(-2px) scale(1.02);
    box-shadow:0 14px 34px -6px rgba(255,93,115,.65);
  }
  .party-btn:active{ transform:translateY(0) scale(.97); }
  .party-btn .spark{
    display:inline-block;
    animation:spin 3.5s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  .overlay{
    position:fixed;
    inset:0;
    background:rgba(9,5,22,.72);
    backdrop-filter:blur(6px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top,0px));
    padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease;
    z-index:10;
  }
  .overlay.open{ opacity:1; pointer-events:auto; }
  .overlay .qr-card{
    max-width:340px;
    position:relative;
    transform:translateY(18px) scale(.94);
    opacity:0;
    transition:transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s ease;
  }
  .overlay.open .qr-card{
    transform:translateY(0) scale(1);
    opacity:1;
  }
  .overlay-close{
    position:absolute;
    top:-14px;
    right:-14px;
    width:34px;height:34px;
    border-radius:50%;
    border:none;
    background:var(--bg2);
    color:var(--text);
    font-size:18px;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.4);
  }

  .footer{
    margin-top:36px;
    font-size:13px;
    color:rgba(245,241,255,.4);
  }

  @media (prefers-reduced-motion: reduce){
    .balloon{ animation:none; }
    .confetti{ display:none; }
    .party-btn .spark{ animation:none; }
  }
</style>
</head>

<div class="stage">

    <div class="balloon b1"></div>
    <div class="balloon b2"></div>
    <div class="balloon b3"></div>
    <div class="balloon b4"></div>
  </div>

  <p class="eyebrow">A little something for</p>
  <h1>Happy Birthday</h1>
  <p class="name">Abhishek 🎉</p>
  <p class="wish">Louder laughs, lighter worries — <strong>make a wish.</strong></p>

          <stop offset="0%" stop-color="#F5F1FF"/>
          <stop offset="100%" stop-color="#C9A7EB"/>
        </linearGradient>
        <linearGradient id="cakeGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#46E0C6"/>
          <stop offset="100%" stop-color="#2c9e8d"/>
        </linearGradient>
      </defs>
      <rect x="57" y="30" width="6" height="12" rx="2" fill="#e6dfff"/>
      <path d="M20 52 Q60 40 100 52 L100 58 Q60 46 20 58 Z" fill="url(#icingGrad)"/>
      <rect x="16" y="58" width="88" height="32" rx="10" fill="url(#cakeGrad)"/>
      <rect x="16" y="58" width="88" height="10" rx="5" fill="#F5F1FF" opacity=".25"/>
    </svg>
    <p class="cake-hint">tap the flame</p>
  </div>

  <button class="party-btn" id="partyBtn" type="button">
    <span class="spark">🎈</span> Feed Poor
  </button>
</div>

    b.addEventListener('click', () => {
      if(b.classList.contains('launched')) return;
      b.classList.add('launched');
      setTimeout(() => b.classList.remove('launched'), 2000);
    });
  });

  const flame = document.getElementById('flame');
  const smoke = document.getElementById('smokeGroup');
  const cakeWrap = document.getElementById('cakeWrap');
  let lit = true;
  cakeWrap.addEventListener('click', () => {
    if(!lit) return;
    lit = false;
    flame.classList.add('out');
    smoke.classList.add('show');
    burst(90);
    setTimeout(() => {
      smoke.classList.remove('show');
      flame.classList.remove('out');
      lit = true;
    }, 3200);
  });
</script>

<script>
  const colors = ['#FFC857','#FF5D73','#46E0C6','#C9A7EB','#F5F1FF'];
  const stage = document.body;
  function burst(n){
    for(let i=0;i<n;i++){
      const c = document.createElement('div');
      c.className = 'confetti';
      c.style.left = Math.random()*100 + 'vw';
      c.style.background = colors[Math.floor(Math.random()*colors.length)];
      c.style.animationDuration = (2.6 + Math.random()*2.2) + 's';
      c.style.animationDelay = (Math.random()*0.6) + 's';
      c.style.width = (5 + Math.random()*5) + 'px';
      c.style.height = (10 + Math.random()*8) + 'px';
      stage.appendChild(c);
      setTimeout(()=>c.remove(), 5200);
    }
  }
  burst(60);
  setInterval(()=>burst(14), 4200);
</script>

</body>
</html>
